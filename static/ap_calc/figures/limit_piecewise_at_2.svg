<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Piecewise function graph for limit at x equals 2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)" rx="12"/>
  <line x1="60" y1="240" x2="440" y2="240" stroke="#4c3d99" stroke-width="2"/>
  <line x1="60" y1="40" x2="60" y2="240" stroke="#4c3d99" stroke-width="2"/>
  <text x="448" y="248" font-size="14" fill="#4c3d99">x</text>
  <text x="48" y="52" font-size="14" fill="#4c3d99">y</text>
  <!-- grid -->
  <g stroke="#e8e4ff" stroke-width="1">
    <line x1="140" y1="40" x2="140" y2="240"/><line x1="220" y1="40" x2="220" y2="240"/>
    <line x1="300" y1="40" x2="300" y2="240"/><line x1="380" y1="40" x2="380" y2="240"/>
    <line x1="60" y1="180" x2="440" y2="180"/><line x1="60" y1="120" x2="440" y2="120"/>
  </g>
  <!-- y = x+1, x<2 -->
  <line x1="80" y1="220" x2="218" y2="82" stroke="#6a4ce6" stroke-width="3.5"/>
  <!-- y = -x+5, x>2 -->
  <line x1="222" y1="82" x2="420" y2="240" stroke="#6a4ce6" stroke-width="3.5"/>
  <!-- open circle (2,3) limit -->
  <circle cx="220" cy="100" r="7" fill="#fff" stroke="#6a4ce6" stroke-width="3"/>
  <!-- filled dot f(2)=1.5 -->
  <circle cx="220" cy="165" r="7" fill="#6a4ce6"/>
  <text x="228" y="98" font-size="13" fill="#4c3d99">(2, 3) open</text>
  <text x="228" y="178" font-size="13" fill="#4c3d99">f(2)=1.5</text>
  <text x="150" y="268" font-size="12" fill="#666">lim x’2 f(x) = 3</text>
</svg>
